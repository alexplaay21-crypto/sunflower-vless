name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # gradlew / gradle-wrapper.jar сознательно не хранятся в репозитории:
      # бинарный jar нельзя безопасно сгенерировать без локального запуска Gradle,
      # а раз сборка всё равно идёт только через CI (нет компьютера), официальный
      # action сам ставит нужную версию Gradle и кэширует зависимости между запусками.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sunflower-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
