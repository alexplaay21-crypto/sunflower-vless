name: Android Release

# Запускать вручную, когда готов очередной релиз. Требует 4 secrets,
# созданных один раз через generate-release-keystore.yml (см. его
# описание). Без них шаг с decode просто не выполнится (условие ниже),
# а signingConfig в app/build.gradle.kts не назначится — сборка либо
# соберётся debug-подписанной, либо потребует явного запуска
# generate-release-keystore.yml сначала.

on:
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Decode keystore from secret
        if: ${{ secrets.SUNFLOWER_KEYSTORE_BASE64 != '' }}
        env:
          SUNFLOWER_KEYSTORE_BASE64: ${{ secrets.SUNFLOWER_KEYSTORE_BASE64 }}
        run: |
          echo "$SUNFLOWER_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        env:
          SUNFLOWER_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          SUNFLOWER_KEYSTORE_PASSWORD: ${{ secrets.SUNFLOWER_KEYSTORE_PASSWORD }}
          SUNFLOWER_KEY_ALIAS: ${{ secrets.SUNFLOWER_KEY_ALIAS }}
          SUNFLOWER_KEY_PASSWORD: ${{ secrets.SUNFLOWER_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: sunflower-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
