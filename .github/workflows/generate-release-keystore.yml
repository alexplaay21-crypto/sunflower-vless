name: Generate Release Keystore (one-time)

# Запускать ОДИН раз вручную (Actions -> Generate Release Keystore ->
# Run workflow), перед первым использованием release.yml.
#
# Генерирует новый keystore со СЛУЧАЙНЫМИ паролями прямо в раннере и
# отдаёт всё как downloadable artifact — ничего не печатается в лог
# запуска, чтобы пароли туда не попали. Проверено реальным прогоном
# keytool перед тем, как класть команду сюда (см. сообщение в чате) —
# современный keytool по умолчанию создаёт PKCS12-хранилище, где
# store-пароль и key-пароль технически не могут отличаться, поэтому
# ниже используется один и тот же пароль для обоих намеренно, а не по
# невнимательности.
#
# ПОСЛЕ запуска:
#  1. Скачать артефакт "sunflower-release-keystore" из этого run'а.
#  2. В нём: keystore-base64.txt и secrets-to-add.txt.
#  3. Repo Settings -> Secrets and variables -> Actions -> New repository
#     secret, добавить 4 секрета с именами и значениями из этих файлов
#     (SUNFLOWER_KEYSTORE_BASE64, SUNFLOWER_KEYSTORE_PASSWORD,
#     SUNFLOWER_KEY_ALIAS, SUNFLOWER_KEY_PASSWORD).
#  4. Удалить скачанные файлы с телефона после того, как секреты добавлены.
#
# ВАЖНО: если репозиторий публичный, сделай его приватным до запуска —
# artifact виден всем, у кого есть доступ читать Actions этого репозитория.
# Отдельно сохрани сам .jks-файл (или keystore-base64.txt) в надёжном
# месте — это единственный ключ подписи приложения; если он потеряется,
# следующие релизы нельзя будет обновить поверх старых установок.

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate keystore with a random password
        run: |
          mkdir -p out
          STORE_PASS=$(openssl rand -base64 24)
          keytool -genkeypair -v \
            -keystore out/sunflower-release.jks \
            -alias sunflower \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STORE_PASS" -keypass "$STORE_PASS" \
            -dname "CN=Sunflower, OU=Sunflower, O=Sunflower, L=Unknown, S=Unknown, C=RU"
          base64 -w0 out/sunflower-release.jks > out/keystore-base64.txt
          {
            echo "SUNFLOWER_KEYSTORE_BASE64=(содержимое файла keystore-base64.txt)"
            echo "SUNFLOWER_KEYSTORE_PASSWORD=$STORE_PASS"
            echo "SUNFLOWER_KEY_ALIAS=sunflower"
            echo "SUNFLOWER_KEY_PASSWORD=$STORE_PASS"
          } > out/secrets-to-add.txt

      - name: Upload keystore bundle
        uses: actions/upload-artifact@v4
        with:
          name: sunflower-release-keystore
          path: out/
          retention-days: 1
